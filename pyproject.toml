[project]
name = "gta5-vision-driving-agent"
version = "0.1.0"
description = "Legacy computer-vision driving-agent study for Grand Theft Auto V"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy",
  "pandas",
  "tensorflow",
  "opencv-python",
  "pynput",
  "tflearn"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "mypy",
  "pre-commit"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
